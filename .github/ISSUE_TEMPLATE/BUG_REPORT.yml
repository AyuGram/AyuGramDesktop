name: Bug report
description: Report errors or unexpected behavior in Drakeygram Desktop.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with **Drakeygram Desktop**.

        Please fill in the details below so we can reproduce the problem.
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: What should happen
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: What happens instead
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: >
        OS name, version, and desktop environment if relevant.
        Do not use kernel-only version strings.
    validations:
      required: true
  - type: input
    attributes:
      label: Version of Drakeygram Desktop
      description: >
        Use the real version string from the app, not "latest".
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation source
      multiple: false
      options:
        - Self-built from this repository
        - Binary from GitHub Releases
        - Other (unofficial) source
    validations:
      required: true
  - type: input
    attributes:
      label: Crash ID
      description: >
        If reporting a crash, enter the crash ID from the crash reporter if available.
  - type: textarea
    attributes:
      label: Logs
      description: >
        You can find log.txt using the `viewlogs` cheat code
        (see Telegram Desktop wiki).
      placeholder: Paste relevant log sections if needed
      render: shell
