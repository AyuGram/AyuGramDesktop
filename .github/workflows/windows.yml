name: Build LupinGram Windows

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache ThirdParty and Libraries
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty
            Libraries
          key: win-x64-deps-v1-${{ hashFiles('Telegram/build/prepare/win.bat') }}

      - name: Patch MSYS2 diffutils & skip breakpad
        shell: pwsh
        run: |
          Get-ChildItem -Path "Telegram/build" -Recurse -Include *.py,*.bat | ForEach-Object {
            (Get-Content $_.FullName) -replace 'mingw-w64-x86_64-diffutils', 'diffutils' | Set-Content $_.FullName
          }
          $preparePy = "Telegram/build/prepare/prepare.py"
          if (Test-Path $preparePy) {
            (Get-Content $preparePy) -replace "'breakpad',", "# 'breakpad'," -replace '"breakpad",', '# "breakpad",' | Set-Content $preparePy
          }

      - name: Prepare dependencies
        run: |
          cd Telegram/build/prepare
          ./win.bat

      - name: Configure & Build
        run: |
          cd Telegram
          ./configure.bat -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ../out --config Release --target Telegram --parallel

      - name: Upload LupinGram.exe
        uses: actions/upload-artifact@v4
        with:
          name: LupinGram-Windows-x64
          path: out/Release/Telegram.exe
