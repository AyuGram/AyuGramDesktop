name: Build AyuGram Windows

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare dependencies (Telegram libraries, Qt, vcpkg и т.д.)
        shell: cmd
        run: |
          Telegram\build\prepare\win.bat
      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          configure.bat x64 ^
            -D TDESKTOP_API_ID=20978459 ^
            -D TDESKTOP_API_HASH=0e413a0c0c0810eac6a0213c5fe54883
      - name: Build Debug
        shell: cmd
        run: |
          msbuild out\Telegram.sln ^
            /p:Configuration=Debug ^
            /p:Platform=x64 ^
            /m ^
            /verbosity:normal
      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-Debug
          path: out\Debug\*
          retention-days: 7
