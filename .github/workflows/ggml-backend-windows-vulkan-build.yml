name: GGML backend Windows Vulkan build

on:
  workflow_dispatch: {}
  push:
    branches: [dev]
    paths:
      - 'Telegram/ThirdParty/whisper.cpp'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}
      full-sha: ${{ steps.vars.outputs.full-sha }}
      api-version: ${{ steps.vars.outputs.api-version }}
      whisper-version: ${{ steps.vars.outputs.version }}
      zip-name: ${{ steps.package.outputs.zip_path }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            Telegram/ThirdParty/whisper.cpp

      - name: Init whisper.cpp submodule
        run: git submodule update --init Telegram/ThirdParty/whisper.cpp

      - id: vars
        uses: ./.github/actions/ggml-backend/resolve-vars

      - name: Install Vulkan SDK
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Configure
        run: >
          cmake -S Telegram/ThirdParty/whisper.cpp -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_SHARED_LIBS=ON
          -DGGML_BACKEND_DL=ON
          -DGGML_NATIVE=OFF
          -DWHISPER_BUILD_TESTS=OFF
          -DWHISPER_BUILD_EXAMPLES=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DGGML_VULKAN=ON

      - name: Build
        run: cmake --build build --config Release --target ggml-vulkan ggml-base

      - name: Package
        shell: pwsh
        run: |
          $dest = "package"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item build/bin/Release/ggml-vulkan.dll $dest/
          Copy-Item build/bin/Release/ggml-base.dll $dest/
          $zipName = "ggml-vulkan-windows-x64-${{ steps.vars.outputs.short-sha }}.zip"
          Compress-Archive -Path "$dest/*" -DestinationPath $zipName
          echo "zip_path=$zipName" >> $env:GITHUB_OUTPUT
        id: package

      - uses: actions/upload-artifact@v7
        with:
          name: ggml-vulkan-windows-x64
          path: ${{ steps.package.outputs.zip_path }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ggml-manifest-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: ggml-vulkan-windows-x64

      - uses: ./.github/actions/ggml-backend/publish
        with:
          zip-path: ${{ needs.build.outputs.zip-name }}
          short-sha: ${{ needs.build.outputs.short-sha }}
          whisper-cpp-commit: ${{ needs.build.outputs.full-sha }}
          api-version: ${{ needs.build.outputs.api-version }}
          whisper-cpp-version: ${{ needs.build.outputs.whisper-version }}
