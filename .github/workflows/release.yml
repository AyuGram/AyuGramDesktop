name: Automatic Release Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch codegen scanner for ayu_ prefix
        run: |
          python3 -c "
          p = 'Telegram/codegen/codegen/lang/subsets.cpp'
          c = open(p).read()
          old = 'if (data[i] != \'l\'\n\t\t\t|| data[i + 1] != \'n\'\n\t\t\t|| data[i + 2] != \'g\'\n\t\t\t|| data[i + 3] != \'_\''
          new = 'const auto isLng = (data[i] == \'l\' && data[i + 1] == \'n\' && data[i + 2] == \'g\' && data[i + 3] == \'_\');\n\t\tconst auto isAyu = (data[i] == \'a\' && data[i + 1] == \'y\' && data[i + 2] == \'u\' && data[i + 3] == \'_\');\n\t\tif ((!isLng && !isAyu)'
          if old in c:
              open(p, 'w').write(c.replace(old, new))
          "

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up build environment
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ${{ runner.os }}-linux-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-ccache-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: tdesktop:centos_env

      - name: Build Telegram Desktop
        run: |
          rm -rf out/Debug/gen/lang_subsets out/Release/gen/lang_subsets out/Debug/Telegram/gen/lang_subsets out/Release/Telegram/gen/lang_subsets
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          tdesktop:centos_env \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D TDESKTOP_API_ID=2040 \
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Package Linux Binary
        run: |
          mkdir -p out/Release
          BIN_PATH=$(find out/ \( -name "AyuGram" -o -name "Telegram" \) -type f | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            BIN_NAME=$(basename "$BIN_PATH")
            BIN_DIR=$(dirname "$BIN_PATH")
            cd "$BIN_DIR"
            FILES="$BIN_NAME"
            test -f Updater && FILES="$FILES Updater"
            tar -czvf Linux.tar.gz $FILES
            if [ "$(realpath .)" != "$(realpath $GITHUB_WORKSPACE/out/Release)" ]; then
              cp Linux.tar.gz "$GITHUB_WORKSPACE/out/Release/Linux.tar.gz" || true
            fi
          else
            echo "Error: Binary not found under out/"
            find out/ -maxdepth 3 || true
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux
          path: out/Release/Linux.tar.gz

      - name: Upload Linux Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: out/Release/Linux.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-14
    env:
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free up disk space on macOS
        run: |
          sudo rm -rf /usr/local/share/android-sdk /usr/local/lib/node_modules || true
          sudo rm -rf /Applications/Xcode_13*.app /Applications/Xcode_14*.app /Applications/Xcode_15.[0-3]*.app || true
          brew cleanup -s || true
          rm -rf ~/Library/Caches/Homebrew || true
          df -h

      - name: Patch codegen scanner for ayu_ prefix
        run: |
          python3 -c "
          p = 'Telegram/codegen/codegen/lang/subsets.cpp'
          c = open(p).read()
          old = 'if (data[i] != \'l\'\n\t\t\t|| data[i + 1] != \'n\'\n\t\t\t|| data[i + 2] != \'g\'\n\t\t\t|| data[i + 3] != \'_\''
          new = 'const auto isLng = (data[i] == \'l\' && data[i + 1] == \'n\' && data[i + 2] == \'g\' && data[i + 3] == \'_\');\n\t\tconst auto isAyu = (data[i] == \'a\' && data[i + 1] == \'y\' && data[i + 2] == \'u\' && data[i + 3] == \'_\');\n\t\tif ((!isLng && !isAyu)'
          if old in c:
              open(p, 'w').write(c.replace(old, new))
          "

      - name: Set up Xcode & ccache
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          brew install ninja nasm yasm pkg-config cmake autoconf automake libtool meson wget gperf ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: Libraries
          key: ${{ runner.os }}-libs-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Prepare libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          cd ..
          for i in {1..5}; do
            echo "Attempt $i to prepare libraries..."
            python3 $GITHUB_WORKSPACE/${{ env.PREPARE_PATH }} && break || (echo "Attempt $i failed, retrying in 15s..." && sleep 15)
          done

      - name: Configure
        run: |
          XCODE_VER=$(xcodebuild -version | awk 'NR==1{print $2}' | cut -d. -f1)
          EXTRA_FLAGS="-GNinja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OSX_ARCHITECTURES=arm64"
          if [ "$XCODE_VER" -lt 16 ]; then
            echo "Xcode version is < 16 ($XCODE_VER), disabling Swift 6..."
            EXTRA_FLAGS="$EXTRA_FLAGS -DDESKTOP_APP_DISABLE_SWIFT6=ON"
          fi
          python3 Telegram/configure.py \
            -DTDESKTOP_API_ID=2040 \
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            $EXTRA_FLAGS

      - name: Build
        run: |
          cmake --build out --config Release -- -j 4

      - name: Package macOS DMG
        run: |
          cd out/Release
          if [ -d "Telegram.app" ]; then
            hdiutil create -volname "AyuGram" -srcfolder Telegram.app -ov -format UDZO macOS.dmg
          else
            echo "Telegram.app not found, listing out/Release contents:"
            ls -la
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: out/Release/macOS.dmg
          if-no-files-found: warn

      - name: Upload macOS Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: out/Release/macOS.dmg

