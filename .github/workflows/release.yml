name: Automatic Release Builder

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch codegen scanner for ayu_ prefix
        run: |
          python3 -c "
          p = 'Telegram/codegen/codegen/lang/subsets.cpp'
          c = open(p).read()
          old = 'if (data[i] != \'l\'\n\t\t\t|| data[i + 1] != \'n\'\n\t\t\t|| data[i + 2] != \'g\'\n\t\t\t|| data[i + 3] != \'_\''
          new = 'const auto isLng = (data[i] == \'l\' && data[i + 1] == \'n\' && data[i + 2] == \'g\' && data[i + 3] == \'_\');\n\t\tconst auto isAyu = (data[i] == \'a\' && data[i + 1] == \'y\' && data[i + 2] == \'u\' && data[i + 3] == \'_\');\n\t\tif ((!isLng && !isAyu)'
          if old in c:
              open(p, 'w').write(c.replace(old, new))
          "

      - name: Patch cmake files for macOS & Linux
        run: |
          python3 -c "
          import os
          p_qt = 'cmake/external/qt/package.cmake'
          if os.path.exists(p_qt):
              c = open(p_qt).read()
              old_qt = 'if (DEFINED QT_VERSION_MAJOR)'
              new_qt = 'if (APPLE)\n    file(GLOB _mac_qt6 \"/opt/homebrew/opt/qt*/lib/cmake/Qt6\" \"/usr/local/opt/qt*/lib/cmake/Qt6\")\n    file(GLOB _mac_qt5 \"/opt/homebrew/opt/qt*/lib/cmake/Qt5\" \"/usr/local/opt/qt*/lib/cmake/Qt5\")\n    list(APPEND CMAKE_PREFIX_PATH ${_mac_qt6} ${_mac_qt5} /opt/homebrew/opt/qt6 /opt/homebrew/opt/qt6/lib/cmake /opt/homebrew/opt/qt /opt/homebrew/opt/qt/lib/cmake /opt/homebrew/opt/qt@5 /opt/homebrew/opt/qt@5/lib/cmake /opt/homebrew/lib/cmake /opt/homebrew /usr/local/opt/qt6 /usr/local/opt/qt6/lib/cmake /usr/local/opt/qt /usr/local/opt/qt/lib/cmake /usr/local/lib/cmake)\nendif()\n\nif (DEFINED QT_VERSION_MAJOR)'
              if old_qt in c and '_mac_qt6' not in c:
                  open(p_qt, 'w').write(c.replace(old_qt, new_qt))
          p_ada = 'cmake/external/ada/CMakeLists.txt'
          if os.path.exists(p_ada):
              c = open(p_ada).read()
              old_ada = 'find_package(ada REQUIRED)'
              new_ada = 'find_package(ada QUIET)\n    if (TARGET ada::ada)\n        target_link_libraries(external_ada INTERFACE ada::ada)\n    else()\n        find_path(ADA_INCLUDE_DIR ada.h HINTS /opt/homebrew/include /usr/local/include /usr/include)\n        find_library(ADA_LIBRARY NAMES ada libada HINTS /opt/homebrew/lib /usr/local/lib /usr/lib)\n        if (ADA_INCLUDE_DIR AND ADA_LIBRARY)\n            target_include_directories(external_ada SYSTEM INTERFACE ${ADA_INCLUDE_DIR})\n            target_link_libraries(external_ada INTERFACE ${ADA_LIBRARY})\n        endif()\n    endif()'
              if old_ada in c:
                  open(p_ada, 'w').write(c.replace(old_ada, new_ada))
          "

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up build environment
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: tdesktop:centos_env

      - name: Build Telegram Desktop
        run: |
          rm -rf out/Debug/gen/lang_subsets out/Release/gen/lang_subsets out/Debug/Telegram/gen/lang_subsets out/Release/Telegram/gen/lang_subsets
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          tdesktop:centos_env \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D TDESKTOP_API_ID=2040 \
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Package Linux Binary
        run: |
          cd out/Release
          tar -czvf Linux.tar.gz Telegram Updater

      - name: Upload Linux Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: out/Release/Linux.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch cmake files for macOS & Linux
        run: |
          python3 -c "
          import os
          p_qt = 'cmake/external/qt/package.cmake'
          if os.path.exists(p_qt):
              c = open(p_qt).read()
              old_qt = 'if (DEFINED QT_VERSION_MAJOR)'
              new_qt = 'if (APPLE)\n    file(GLOB _mac_qt6 \"/opt/homebrew/opt/qt*/lib/cmake/Qt6\" \"/usr/local/opt/qt*/lib/cmake/Qt6\")\n    file(GLOB _mac_qt5 \"/opt/homebrew/opt/qt*/lib/cmake/Qt5\" \"/usr/local/opt/qt*/lib/cmake/Qt5\")\n    list(APPEND CMAKE_PREFIX_PATH ${_mac_qt6} ${_mac_qt5} /opt/homebrew/opt/qt6 /opt/homebrew/opt/qt6/lib/cmake /opt/homebrew/opt/qt /opt/homebrew/opt/qt/lib/cmake /opt/homebrew/opt/qt@5 /opt/homebrew/opt/qt@5/lib/cmake /opt/homebrew/lib/cmake /opt/homebrew /usr/local/opt/qt6 /usr/local/opt/qt6/lib/cmake /usr/local/opt/qt /usr/local/opt/qt/lib/cmake /usr/local/lib/cmake)\nendif()\n\nif (DEFINED QT_VERSION_MAJOR)'
              if old_qt in c and '_mac_qt6' not in c:
                  open(p_qt, 'w').write(c.replace(old_qt, new_qt))
          p_ada = 'cmake/external/ada/CMakeLists.txt'
          if os.path.exists(p_ada):
              c = open(p_ada).read()
              old_ada = 'find_package(ada REQUIRED)'
              new_ada = 'find_package(ada QUIET)\n    if (TARGET ada::ada)\n        target_link_libraries(external_ada INTERFACE ada::ada)\n    else()\n        find_path(ADA_INCLUDE_DIR ada.h HINTS /opt/homebrew/include /usr/local/include /usr/include)\n        find_library(ADA_LIBRARY NAMES ada libada HINTS /opt/homebrew/lib /usr/local/lib /usr/lib)\n        if (ADA_INCLUDE_DIR AND ADA_LIBRARY)\n            target_include_directories(external_ada SYSTEM INTERFACE ${ADA_INCLUDE_DIR})\n            target_link_libraries(external_ada INTERFACE ${ADA_LIBRARY})\n        endif()\n    endif()'
              if old_ada in c:
                  open(p_ada, 'w').write(c.replace(old_ada, new_ada))
          "

      - name: Set up Xcode & Dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          brew install qt@6 qt pkg-config ninja nasm cmake ada cmark-gfm range-v3 fmt || true

      - name: Build macOS Application
        run: |
          QT6_PATH=$(brew --prefix qt@6 2>/dev/null || brew --prefix qt 2>/dev/null || echo "/opt/homebrew/opt/qt6")
          QT_PATH=$(brew --prefix qt 2>/dev/null || echo "/opt/homebrew/opt/qt")
          export CMAKE_PREFIX_PATH="$QT6_PATH;$QT6_PATH/lib/cmake;$QT_PATH;$QT_PATH/lib/cmake;/opt/homebrew;/opt/homebrew/lib/cmake;/usr/local"
          python3 Telegram/configure.py -DDESKTOP_APP_USE_PACKAGED=ON -DTDESKTOP_API_ID=2040 -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          cmake --build out --config Release

      - name: Package macOS DMG
        run: |
          cd out/Release
          hdiutil create -volname "AyuGram" -srcfolder Telegram.app -ov -format UDZO macOS.dmg

      - name: Upload macOS Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: out/Release/macOS.dmg
