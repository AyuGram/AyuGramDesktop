name: Automatic Release Builder

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch codegen scanner for ayu_ prefix
        run: |
          python3 -c "
          p = 'Telegram/codegen/codegen/lang/subsets.cpp'
          c = open(p).read()
          old = 'if (data[i] != \'l\'\n\t\t\t|| data[i + 1] != \'n\'\n\t\t\t|| data[i + 2] != \'g\'\n\t\t\t|| data[i + 3] != \'_\''
          new = 'const auto isLng = (data[i] == \'l\' && data[i + 1] == \'n\' && data[i + 2] == \'g\' && data[i + 3] == \'_\');\n\t\tconst auto isAyu = (data[i] == \'a\' && data[i + 1] == \'y\' && data[i + 2] == \'u\' && data[i + 3] == \'_\');\n\t\tif ((!isLng && !isAyu)'
          if old in c:
              open(p, 'w').write(c.replace(old, new))
          "

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up build environment
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: tdesktop:centos_env

      - name: Build Telegram Desktop
        run: |
          rm -rf out/Debug/gen/lang_subsets out/Release/gen/lang_subsets out/Debug/Telegram/gen/lang_subsets out/Release/Telegram/gen/lang_subsets
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          tdesktop:centos_env \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D TDESKTOP_API_ID=2040 \
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Package Linux Binary
        run: |
          mkdir -p out/Release
          BIN_PATH=$(find out/ \( -name "AyuGram" -o -name "Telegram" \) -type f | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            BIN_NAME=$(basename "$BIN_PATH")
            BIN_DIR=$(dirname "$BIN_PATH")
            cd "$BIN_DIR"
            FILES="$BIN_NAME"
            test -f Updater && FILES="$FILES Updater"
            tar -czvf Linux.tar.gz $FILES
            if [ "$(realpath .)" != "$(realpath $GITHUB_WORKSPACE/out/Release)" ]; then
              cp Linux.tar.gz "$GITHUB_WORKSPACE/out/Release/Linux.tar.gz" || true
            fi
          else
            echo "Error: Binary not found under out/"
            find out/ -maxdepth 3 || true
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux
          path: out/Release/Linux.tar.gz

      - name: Upload Linux Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: out/Release/Linux.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-14
    env:
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free up disk space on macOS
        run: |
          sudo rm -rf /usr/local/share/android-sdk /usr/local/lib/node_modules || true
          sudo rm -rf /Applications/Xcode_13*.app /Applications/Xcode_14*.app /Applications/Xcode_15.[0-3]*.app || true
          brew cleanup -s || true
          rm -rf ~/Library/Caches/Homebrew || true
          df -h

      - name: Patch codegen scanner for ayu_ prefix
        run: |
          python3 -c "
          p = 'Telegram/codegen/codegen/lang/subsets.cpp'
          c = open(p).read()
          old = 'if (data[i] != \'l\'\n\t\t\t|| data[i + 1] != \'n\'\n\t\t\t|| data[i + 2] != \'g\'\n\t\t\t|| data[i + 3] != \'_\''
          new = 'const auto isLng = (data[i] == \'l\' && data[i + 1] == \'n\' && data[i + 2] == \'g\' && data[i + 3] == \'_\');\n\t\tconst auto isAyu = (data[i] == \'a\' && data[i + 1] == \'y\' && data[i + 2] == \'u\' && data[i + 3] == \'_\');\n\t\tif ((!isLng && !isAyu)'
          if old in c:
              open(p, 'w').write(c.replace(old, new))
          "

      - name: Patch lib_translate for Xcode 15 / macOS 14 SDK
        run: |
          python3 -c "
          p = 'Telegram/lib_translate/translate_provider_mac_swift.swift'
          import os
          if os.path.exists(p):
              code = '''import Foundation
import NaturalLanguage
#if canImport(Translation)
import Translation
#endif

typealias TranslateProviderMacSwiftCallback = @convention(c) (
	UnsafeMutableRawPointer?,
	UnsafePointer<CChar>?,
	UnsafePointer<CChar>?
) -> Void

private struct CallbackContext: @unchecked Sendable {
	let value: UnsafeMutableRawPointer?
}

private struct CallbackFunction: @unchecked Sendable {
	let value: TranslateProviderMacSwiftCallback
}

private func duplicatedCString(_ value: String) -> UnsafePointer<CChar>? {
	guard let duplicated = strdup(value) else {
		return nil
	}
	return UnsafePointer(duplicated)
}

#if canImport(Translation)
@available(macOS 15.0, *)
private func requestTranslation(
		_ text: String,
		_ targetLanguage: String) async throws -> String {
	guard let sourceLanguage
		= NLLanguageRecognizer.dominantLanguage(for: text) else {
			throw TranslationError.unableToIdentifyLanguage
		}
	if sourceLanguage.rawValue == targetLanguage {
		return text
	}
	let source = Locale.Language(identifier: sourceLanguage.rawValue)
	let target = Locale.Language(identifier: targetLanguage)
	let availability = LanguageAvailability()
	let status = await availability.status(from: source, to: target)
	switch status {
	case .installed:
		break
	case .supported, .unsupported:
		throw TranslationError.unsupportedLanguagePairing
	@unknown default:
		throw TranslationError.unsupportedLanguagePairing
	}
	let session = TranslationSession(installedSource: source, target: target)
	let response = try await session.translate(text)
	return response.targetText
}

@available(macOS 15.0, *)
private func translateErrorCode(_ error: Error) -> String {
	guard let translationError = error as? TranslationError else {
		return \"unknown\"
	}
	switch translationError {
	case .unsupportedLanguagePairing:
		return \"local-language-pack-missing\"
	default:
		return \"unknown\"
	}
}
#endif

@_cdecl(\"TranslateProviderMacSwiftIsAvailable\")
func TranslateProviderMacSwiftIsAvailable() -> Bool {
#if canImport(Translation)
	if #available(macOS 15.0, *) {
		return true
	}
#endif
	return false
}

@_cdecl(\"TranslateProviderMacSwiftTranslate\")
func TranslateProviderMacSwiftTranslate(
	_ sourceTextUtf8: UnsafePointer<CChar>?,
	_ targetLanguageCodeUtf8: UnsafePointer<CChar>?,
	_ context: UnsafeMutableRawPointer?,
	_ callback: TranslateProviderMacSwiftCallback?
) {
	guard let callback else {
		return
	}
	guard let sourceTextUtf8, let targetLanguageCodeUtf8 else {
		callback(context, nil, duplicatedCString(\"invalid-arguments\"))
		return
	}
	let callbackFunction = CallbackFunction(value: callback)
	let callbackContext = CallbackContext(value: context)
	if #available(macOS 10.15, *) {
		Task.detached(priority: .utility) {
			let callback = callbackFunction.value
			let context = callbackContext.value
#if canImport(Translation)
			if #available(macOS 15.0, *) {
				let sourceText = String(cString: sourceTextUtf8)
				let targetLanguageCode = String(cString: targetLanguageCodeUtf8)
				do {
					let translated = try await requestTranslation(
						sourceText,
						targetLanguageCode)
					callback(context, duplicatedCString(translated), nil)
				} catch {
					callback(
						context,
						nil,
						duplicatedCString(translateErrorCode(error)))
				}
				return
			}
#endif
			callback(context, nil, duplicatedCString(\"unsupported-platform\"))
		}
		return
	}
	callback(context, nil, duplicatedCString(\"unsupported-platform\"))
}
'''
              open(p, 'w').write(code)
          "

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          brew install ninja nasm yasm pkg-config cmake autoconf automake libtool meson wget gperf

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: Libraries
          key: ${{ runner.os }}-libs-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Prepare libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          cd ..
          for i in {1..5}; do
            echo "Attempt $i to prepare libraries..."
            python3 $GITHUB_WORKSPACE/${{ env.PREPARE_PATH }} && break || (echo "Attempt $i failed, retrying in 15s..." && sleep 15)
          done

      - name: Configure
        run: |
          python3 Telegram/configure.py \
            -DTDESKTOP_API_ID=2040 \
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build
        run: |
          cmake --build out --config Release -- -jobs $(sysctl -n hw.logicalcpu)

      - name: Package macOS DMG
        run: |
          cd out/Release
          if [ -d "Telegram.app" ]; then
            hdiutil create -volname "AyuGram" -srcfolder Telegram.app -ov -format UDZO macOS.dmg
          else
            echo "Telegram.app not found, listing out/Release contents:"
            ls -la
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: out/Release/macOS.dmg
          if-no-files-found: warn

      - name: Upload macOS Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: out/Release/macOS.dmg

