name: Linux.

on:
  workflow_dispatch:

jobs:

  linux:
    name: Rocky Linux 8
    runs-on: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}

    strategy:
      matrix:
        defines:
          - ""

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Patch codegen scanner for ayu_ prefix
        run: |
          python3 -c "
          p = 'Telegram/codegen/codegen/lang/subsets.cpp'
          c = open(p).read()
          old = 'if (data[i] != \'l\'\n\t\t\t|| data[i + 1] != \'n\'\n\t\t\t|| data[i + 2] != \'g\'\n\t\t\t|| data[i + 3] != \'_\''
          new = 'const auto isLng = (data[i] == \'l\' && data[i + 1] == \'n\' && data[i + 2] == \'g\' && data[i + 3] == \'_\');\n\t\tconst auto isAyu = (data[i] == \'a\' && data[i + 1] == \'y\' && data[i + 2] == \'u\' && data[i + 3] == \'_\');\n\t\tif ((!isLng && !isAyu)'
          if old in c:
              open(p, 'w').write(c.replace(old, new))
          "

      - name: Patch cmake files for macOS & Linux
        run: |
          python3 -c "
          import os
          p_qt = 'cmake/external/qt/package.cmake'
          if os.path.exists(p_qt):
              c = open(p_qt).read()
              old_qt = 'if (DEFINED QT_VERSION_MAJOR)'
              new_qt = 'if (APPLE)\n    list(APPEND CMAKE_PREFIX_PATH /opt/homebrew/opt/qt6 /opt/homebrew/opt/qt /opt/homebrew/lib/cmake/Qt6 /opt/homebrew/lib/cmake/Qt5 /opt/homebrew /usr/local/opt/qt6 /usr/local/opt/qt /usr/local/lib/cmake/Qt6 /usr/local/lib/cmake/Qt5)\nendif()\n\nif (DEFINED QT_VERSION_MAJOR)'
              if old_qt in c and 'opt/homebrew/opt/qt6' not in c:
                  open(p_qt, 'w').write(c.replace(old_qt, new_qt))
          p_ada = 'cmake/external/ada/CMakeLists.txt'
          if os.path.exists(p_ada):
              c = open(p_ada).read()
              old_ada = 'find_package(ada REQUIRED)'
              new_ada = 'find_package(ada QUIET)\n    if (TARGET ada::ada)\n        target_link_libraries(external_ada INTERFACE ada::ada)\n    else()\n        find_path(ADA_INCLUDE_DIR ada.h HINTS /opt/homebrew/include /usr/local/include /usr/include)\n        find_library(ADA_LIBRARY NAMES ada libada HINTS /opt/homebrew/lib /usr/local/lib /usr/lib)\n        if (ADA_INCLUDE_DIR AND ADA_LIBRARY)\n            target_include_directories(external_ada SYSTEM INTERFACE ${ADA_INCLUDE_DIR})\n            target_link_libraries(external_ada INTERFACE ${ADA_LIBRARY})\n        endif()\n    endif()'
              if old_ada in c:
                  open(p_ada, 'w').write(c.replace(old_ada, new_ada))
          "

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Telegram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Telegram" >> $GITHUB_ENV
          fi

          ccache -z
          rm -rf out/Debug/gen/lang_subsets out/Release/gen/lang_subsets out/Debug/Telegram/gen/lang_subsets

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Debug \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D TDESKTOP_API_ID=2040 \
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE

      - name: Count ccache misses.
        id: ccache-stats
        if: env.ONLY_CACHE == 'false'
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        run: ccache --evict-older-than 1d

      - name: Save Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/Debug/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd out/Debug
          mkdir artifact
          mv {Telegram,Updater} artifact/
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/Debug/artifact/
